<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YZRS Times — 夕刊（探索版）</title>
<meta name="description" content="YZRS Timesの縮刷版を、目次と時間軸の星図から探索する夕刊ビュー。" />
<meta name="google-adsense-account" content="ca-pub-8467165715973366" />
<link rel="canonical" href="https://yzrswork.com/evening.html" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8467165715973366"
     crossorigin="anonymous"></script>
<script src="/analytics.js"></script>
<style>
  /* 夕刊は意図して夜の紙面。朝刊のテラコッタとクリームを夜空側へ反転する */
  :root {
    --night: #14110c;
    --night-2: #1d1913;
    --night-3: #262017;
    --ink: #e9dfc9;
    --ink-dim: #8b7f66;
    --accent: #d96f36;
    --line: rgba(233, 223, 201, 0.14);
    --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    display: flex; flex-direction: column;
  }

  header.masthead {
    flex: none;
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 8px;
    background: var(--night);
    z-index: 5;
  }
  .masthead-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }
  .brand a { color: var(--ink); text-decoration: none; }
  .edition-tag {
    color: var(--accent); border: 1px solid var(--accent);
    font-size: 11px; padding: 1px 8px; letter-spacing: 0.2em;
    font-family: var(--sans);
  }
  .meta { color: var(--ink-dim); font-size: 12px; }
  .back-link { margin-left: auto; font-size: 12px; }
  .back-link a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  .back-link a:hover { color: var(--ink); }

  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 8px;
    font-family: var(--sans);
  }
  .view-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .view-switch button {
    background: none; border: none; color: var(--ink-dim); font-size: 12px;
    padding: 5px 14px; cursor: pointer; font-family: inherit; letter-spacing: 0.1em;
  }
  .view-switch button.active { background: var(--night-3); color: var(--ink); }
  .view-switch button:hover:not(.active) { color: var(--ink); }
  .controls input[type="search"] {
    background: var(--night-2); border: 1px solid var(--line); color: var(--ink);
    padding: 5px 10px; font-size: 13px; width: 200px; border-radius: 3px;
    font-family: inherit;
  }
  .controls input[type="search"]:focus { outline: 1px solid var(--accent); }
  .btn-reset {
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    font-size: 12px; padding: 4px 10px; cursor: pointer; border-radius: 3px; font-family: inherit;
  }
  .btn-reset:hover { color: var(--ink); border-color: var(--ink-dim); }
  .legend { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .legend .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-dim);
    border: 1px solid transparent; border-radius: 10px; padding: 2px 8px;
    cursor: pointer; user-select: none;
  }
  .legend .chip:hover { border-color: var(--line); color: var(--ink); }
  .legend .chip.off { opacity: 0.35; }
  .legend .chip.off .dot { background: var(--ink-dim) !important; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  main { flex: 1; position: relative; overflow: hidden; }

  /* ---------- 目次ビュー ---------- */
  #toc {
    position: absolute; inset: 0; overflow-y: auto; padding: 18px 16px 40px;
  }
  .toc-inner { max-width: 760px; margin: 0 auto; }
  .toc-lead { color: var(--ink-dim); font-size: 12.5px; line-height: 1.9; margin-bottom: 14px; }
  .kw-strip { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .kw-strip .kw {
    font-family: var(--sans); font-size: 11.5px; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; cursor: pointer;
  }
  .kw-strip .kw b { color: var(--ink); font-weight: 600; }
  .kw-strip .kw:hover { color: var(--accent); border-color: var(--accent); }
  .toc-month {
    font-family: var(--sans); color: var(--ink-dim); font-size: 12px; letter-spacing: 0.2em;
    border-bottom: 1px solid var(--line); padding-bottom: 5px; margin: 22px 0 4px;
  }
  .toc-row {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--ink); cursor: pointer; font-family: inherit;
    padding: 11px 8px; border-bottom: 1px dotted rgba(233, 223, 201, 0.09);
  }
  .toc-row:hover { background: var(--night-2); }
  .toc-row .row-1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .toc-row .no { color: var(--accent); font-size: 12px; font-family: var(--sans); min-width: 2.6em; }
  .toc-row .ed {
    font-size: 10px; color: var(--ink-dim); border: 1px solid var(--line);
    padding: 0 6px; letter-spacing: 0.15em; font-family: var(--sans);
  }
  .toc-row .theme { font-size: 15.5px; font-weight: 600; }
  .toc-row .date { color: var(--ink-dim); font-size: 11.5px; font-family: var(--sans); margin-left: auto; }
  .toc-row .row-2 {
    display: flex; align-items: center; gap: 10px; margin-top: 5px; padding-left: calc(2.6em + 10px);
  }
  .toc-row .note {
    color: var(--ink-dim); font-size: 12px; line-height: 1.6; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .toc-row .dots { display: inline-flex; gap: 3px; flex: none; }
  .toc-row .dots i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .toc-empty { color: var(--ink-dim); font-size: 13px; padding: 30px 0; text-align: center; }

  /* ---------- 星図ビュー ---------- */
  #chart-wrap { position: absolute; inset: 0; display: none; }
  canvas#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas#chart.dragging { cursor: grabbing; }
  .hint {
    position: absolute; left: 12px; bottom: 42px; color: var(--ink-dim);
    font-size: 11px; pointer-events: none; opacity: 0.8;
    font-family: var(--sans);
  }

  aside#panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 330px; max-width: 88vw;
    background: rgba(29, 25, 19, 0.96); border-left: 1px solid var(--line);
    padding: 16px; overflow-y: auto; transform: translateX(0); transition: transform 0.18s ease;
    z-index: 4;
  }
  aside#panel.hidden { transform: translateX(105%); }
  #panel .panel-close {
    position: absolute; top: 8px; right: 10px; background: none; border: none;
    color: var(--ink-dim); font-size: 18px; cursor: pointer; font-family: inherit;
  }
  #panel .panel-kicker { color: var(--accent); font-size: 11px; letter-spacing: 0.2em; margin-bottom: 6px;
    font-family: var(--sans); }
  #panel h2 { font-size: 16px; line-height: 1.5; margin-bottom: 8px; font-weight: 700; }
  #panel h2 a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  #panel h2 a:hover { border-bottom-color: var(--accent); }
  #panel .panel-meta { color: var(--ink-dim); font-size: 12px; margin-bottom: 10px; line-height: 1.7; }
  #panel .summary { border-left: 2px solid var(--accent); padding-left: 10px; margin: 10px 0; }
  #panel .summary p { font-size: 13px; line-height: 1.9; color: var(--ink); }
  #panel .theme-note { font-size: 13px; line-height: 1.9; color: var(--ink); margin: 10px 0; }
  #panel .kw-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #panel .kw-chips button {
    font-size: 11px; color: var(--ink-dim); border: 1px solid var(--line); background: none;
    padding: 1px 8px; border-radius: 10px; cursor: pointer;
    font-family: var(--sans);
  }
  #panel .kw-chips button:hover { color: var(--accent); border-color: var(--accent); }
  #panel ul.linked { list-style: none; margin-top: 8px; }
  #panel ul.linked li { margin-bottom: 8px; font-size: 13px; line-height: 1.6; }
  #panel ul.linked li a { color: var(--ink); text-decoration: none; cursor: pointer; border-bottom: 1px dotted var(--line); }
  #panel ul.linked li a:hover { color: var(--accent); }
  #panel ul.linked li .sub { color: var(--ink-dim); font-size: 11px; display: block; }
  #panel .cat-mark { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  footer.colophon {
    flex: none; border-top: 1px solid var(--line); color: var(--ink-dim);
    font-size: 11px; text-align: center; padding: 6px 10px;
  }
  footer.colophon a { color: inherit; }

  @media (max-width: 640px) {
    .controls input[type="search"] { width: 130px; }
    .legend { display: none; }
    aside#panel { width: 100%; max-width: 100%; top: auto; height: 46%; border-left: none; border-top: 1px solid var(--line); }
    aside#panel.hidden { transform: translateY(105%); }
    .toc-row .date { margin-left: 0; }
    .toc-row .row-2 { padding-left: 0; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <div class="brand"><a href="/times/?mode=day">YZRS Times</a></div>
    <div class="edition-tag">夕刊 EVENING EDITION</div>
    <div class="meta" id="meta-line">縮刷版を読み込み中…</div>
    <div class="back-link"><a href="/times/?mode=day">一面へ戻る（通常表示）</a></div>
  </div>
  <div class="controls">
    <div class="view-switch">
      <button id="btn-toc" class="active">目次</button>
      <button id="btn-chart">星図</button>
    </div>
    <input type="search" id="search" placeholder="記事、キーワード、テーマを探す" autocomplete="off">
    <button class="btn-reset" id="btn-reset">表示リセット</button>
    <div class="legend" id="legend"></div>
  </div>
</header>

<main>
  <div id="toc"><div class="toc-inner" id="toc-inner"></div></div>
  <div id="chart-wrap">
    <canvas id="chart"></canvas>
    <div class="hint">ドラッグで移動 / ホイール、ピンチで拡大 / 星を選ぶと詳細 / キーワードを選ぶと星座線</div>
  </div>
  <aside id="panel" class="hidden">
    <button class="panel-close" id="panel-close">×</button>
    <div id="panel-body"></div>
  </aside>
</main>

<footer class="colophon">YZRS Times 夕刊 — 縮刷版アーカイブの探索モード。号を重ねるほど星図は育つ ／ <a href="/">工房トップ</a> ／ <a href="/about/">運営者・編集方針</a> ／ <a href="/privacy/">プライバシー</a></footer>

<script>
(function () {
'use strict';

/* ---------- 配色（カテゴリはCVD検証済みパレット） ---------- */
var CAT_COLORS = {
  tech: '#d96f36', news: '#5e97d6', programming: '#b08a29',
  oss: '#47a06e', blog: '#b571c0', trends: '#d16a86', general: '#8d8577',
};
var CAT_ORDER = ['tech', 'news', 'programming', 'oss', 'blog', 'trends', 'general'];
var CAT_LABEL = {
  tech: 'テック', news: '時事', programming: 'プログラミング',
  oss: 'OSS', blog: 'ブログ', trends: 'トレンド', general: 'その他',
};
var EDITION_LABEL = { morning: '朝刊', midday: '昼刊', evening: '夕刊' };
var COLOR_ISSUE = '#e9dfc9';
var COLOR_THREAD = '#d96f36';
function catColor(c) { return CAT_COLORS[c] || CAT_COLORS.general; }

/* ---------- レイアウト定数（決定論。物理シミュレーションは使わない） ---------- */
var COL_W = 104;        // 1号 = 1列
var SPINE_Y = 96;       // 号の星の高さ
var ART_TOP = 168;      // 記事の開始高さ
var ART_GAP = 30;       // 記事の縦間隔
var AXIS_H = 34;        // 下端の時間軸

var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 状態 ---------- */
var issues = [], articles = [], articleById = {}, issueById = {};
var colOfIssue = {};    // issueId -> 列番号
var colArticles = {};   // 列番号 -> [article]（描画とヒットテストの走査用）
var kwIndex = {};       // keyword -> [articleId]（2記事以上のみ）
var sharedPairs = {};   // issueId -> [{issueId, count}]（記事の重なりによる号どうしの結線）
var topKeywords = [];
var hiddenCats = {};    // category -> true で非表示
var view = 'toc';       // 'toc' | 'chart'
var cam = { x: 0, y: 0, scale: 1 };
var selected = null;    // {type:'article'|'issue'|'keyword', id}
var topicKw = null;     // 選択中のキーワード（星座線）
var threadT = 1;        // 星座線の描画アニメーション進行 0..1
var hovered = null;
var searchQ = '';
var shootingStar = null;

var canvas = document.getElementById('chart');
var ctx = canvas.getContext('2d');
var dpr = Math.max(1, window.devicePixelRatio || 1);

/* ---------- ハッシュ由来の決定論ゆらぎ（描画のたびに同じ夜空になる） ---------- */
function hash32(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
function jitter(id, salt, range) {
  return ((hash32(id + salt) % 1000) / 1000 - 0.5) * 2 * range;
}

/* ---------- 読み込み ---------- */
fetch('data/graph.json', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(init)
  .catch(function (err) {
    document.getElementById('meta-line').textContent = '縮刷版の読み込みに失敗しました（' + err.message + '）';
  });

function init(graph) {
  if (!graph.issues || !graph.articles) {
    document.getElementById('meta-line').textContent = '紙面データの形式が古いようです。次の発行をお待ちください。';
    return;
  }
  issues = graph.issues;
  articles = graph.articles;
  issues.forEach(function (iss, idx) { issueById[iss.id] = iss; colOfIssue[iss.id] = idx; });

  // 記事の座席割り: 所属列（初掲載号）ごとにカテゴリ順で縦に積む
  var seatCount = {};
  articles.slice().sort(function (a, b) {
    var ca = CAT_ORDER.indexOf(a.category), cb = CAT_ORDER.indexOf(b.category);
    if (ca !== cb) return ca - cb;
    return (b.temperature || 0) - (a.temperature || 0);
  }).forEach(function (a) {
    articleById[a.id] = a;
    a.col = colOfIssue[a.issues[0]] ?? 0;
    var seat = seatCount[a.col] || 0;
    seatCount[a.col] = seat + 1;
    a.x = a.col * COL_W + jitter(a.id, 'x', 17);
    a.y = ART_TOP + seat * ART_GAP + jitter(a.id, 'y', 7);
    a.r = 2.6 + Math.max(0, (a.temperature || 40)) / 24; // Heatで星の大きさが変わる
    a.phase = (hash32(a.id) % 628) / 100; // またたきの位相
    (colArticles[a.col] = colArticles[a.col] || []).push(a);
  });

  // キーワード索引（2記事以上で共起する語だけが星座になる）
  var kwAll = {};
  articles.forEach(function (a) {
    (a.keywords || []).forEach(function (k) { (kwAll[k] = kwAll[k] || []).push(a.id); });
  });
  Object.keys(kwAll).forEach(function (k) {
    if (kwAll[k].length >= 2) kwIndex[k] = kwAll[k].sort(function (x, y) { return articleById[x].col - articleById[y].col; });
  });
  topKeywords = Object.keys(kwIndex).sort(function (a, b) { return kwIndex[b].length - kwIndex[a].length; }).slice(0, 14);

  // 号どうしの結線 = 記事の重なり（テーマの語の一致には依存しない）
  var pair = {};
  articles.forEach(function (a) {
    for (var i = 0; i < a.issues.length; i++) {
      for (var j = i + 1; j < a.issues.length; j++) {
        var key = a.issues[i] + '|' + a.issues[j];
        pair[key] = (pair[key] || 0) + 1;
      }
    }
  });
  Object.keys(pair).forEach(function (key) {
    var p = key.split('|');
    (sharedPairs[p[0]] = sharedPairs[p[0]] || []).push({ issueId: p[1], count: pair[key] });
    (sharedPairs[p[1]] = sharedPairs[p[1]] || []).push({ issueId: p[0], count: pair[key] });
  });
  Object.keys(sharedPairs).forEach(function (k) {
    sharedPairs[k].sort(function (a, b) { return b.count - a.count; });
  });

  var d0 = issues[0], d1 = issues[issues.length - 1];
  document.getElementById('meta-line').textContent =
    '全' + issues.length + '号 ' + articles.length + '記事' +
    (d0 ? '（' + d0.date.replace(/-/g, '.') + ' から ' + d1.date.replace(/-/g, '.') + '）' : '');

  buildLegend();
  buildToc();
  resize();
  resetCamera();
  applyHash();
  requestAnimationFrame(tick);
}

/* ---------- 凡例（クリックでカテゴリ表示切替） ---------- */
function buildLegend() {
  var host = document.getElementById('legend');
  var present = {};
  articles.forEach(function (a) { present[a.category] = true; });
  CAT_ORDER.forEach(function (c) {
    if (!present[c]) return;
    var chip = document.createElement('span');
    chip.className = 'chip';
    var dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = catColor(c);
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(CAT_LABEL[c] || c));
    chip.title = 'クリックで表示切替';
    chip.addEventListener('click', function () {
      hiddenCats[c] = !hiddenCats[c];
      chip.classList.toggle('off', !!hiddenCats[c]);
      buildToc();
    });
    host.appendChild(chip);
  });
}

/* ---------- 目次ビュー（編集長の目次。号が何千に増えてもリストはスケールする） ---------- */
function buildToc() {
  var host = document.getElementById('toc-inner');
  host.innerHTML = '';

  var lead = document.createElement('p');
  lead.className = 'toc-lead';
  lead.textContent = '編集長が号ごとに付けた題を、新しい順に並べた目次です。気になる題から星図へ。よく光る言葉は星座線でたどれます。';
  host.appendChild(lead);

  var strip = document.createElement('div');
  strip.className = 'kw-strip';
  topKeywords.forEach(function (k) {
    var b = document.createElement('button');
    b.className = 'kw';
    b.innerHTML = '<b>' + esc(k) + '</b> ' + kwIndex[k].length;
    b.addEventListener('click', function () { selectKeyword(k); });
    strip.appendChild(b);
  });
  host.appendChild(strip);

  var q = searchQ.toLowerCase();
  var lastMonth = '';
  var shown = 0;
  issues.slice().reverse().forEach(function (iss) {
    var arts = articlesOfIssue(iss.id);
    if (q) {
      var hay = (iss.theme || '') + ' ' + (iss.themeNote || '') + ' ' +
        arts.map(function (a) { return a.title + ' ' + (a.keywords || []).join(' '); }).join(' ');
      if (hay.toLowerCase().indexOf(q) === -1) return;
    }
    var month = iss.date.slice(0, 7);
    if (month !== lastMonth) {
      lastMonth = month;
      var mh = document.createElement('div');
      mh.className = 'toc-month';
      mh.textContent = month.replace('-', '年') + '月';
      host.appendChild(mh);
    }
    host.appendChild(tocRow(iss, arts));
    shown++;
  });
  if (!shown) {
    var empty = document.createElement('div');
    empty.className = 'toc-empty';
    empty.textContent = '「' + searchQ + '」に合う号は見つかりませんでした。';
    host.appendChild(empty);
  }
}

function tocRow(iss, arts) {
  var row = document.createElement('button');
  row.className = 'toc-row';
  var counts = {};
  arts.forEach(function (a) { if (!hiddenCats[a.category]) counts[a.category] = (counts[a.category] || 0) + 1; });
  var dots = CAT_ORDER.filter(function (c) { return counts[c]; }).map(function (c) {
    return '<i style="background:' + catColor(c) + '" title="' + esc(CAT_LABEL[c]) + ' ' + counts[c] + '"></i>';
  }).join('');
  var md = iss.date.slice(5).replace('-', '/');
  row.innerHTML =
    '<span class="row-1">' +
      '<span class="no">#' + esc(iss.issueNo) + '</span>' +
      '<span class="ed">' + esc(EDITION_LABEL[iss.edition] || iss.edition) + '</span>' +
      '<span class="theme">' + (iss.theme ? '『' + esc(iss.theme) + '』' : '（無題）') + '</span>' +
      '<span class="date">' + esc(md) + '</span>' +
    '</span>' +
    '<span class="row-2">' +
      '<span class="note">' + esc(iss.themeNote || '') + '</span>' +
      '<span class="dots">' + dots + '</span>' +
    '</span>';
  row.addEventListener('click', function () { selectIssue(iss.id); });
  return row;
}

function articlesOfIssue(issueId) {
  return articles.filter(function (a) { return a.issues.indexOf(issueId) !== -1; });
}

/* ---------- ビュー切替 ---------- */
var tocEl = document.getElementById('toc');
var chartWrap = document.getElementById('chart-wrap');
var btnToc = document.getElementById('btn-toc');
var btnChart = document.getElementById('btn-chart');

function setView(v) {
  view = v;
  tocEl.style.display = v === 'toc' ? 'block' : 'none';
  chartWrap.style.display = v === 'chart' ? 'block' : 'none';
  btnToc.classList.toggle('active', v === 'toc');
  btnChart.classList.toggle('active', v === 'chart');
  if (v === 'chart') { resize(); }
  syncHash();
}
btnToc.addEventListener('click', function () { setView('toc'); });
btnChart.addEventListener('click', function () { setView('chart'); });

/* ---------- URLハッシュ（共有可能な入口） ---------- */
function syncHash() {
  var h = '';
  if (view === 'chart') {
    if (topicKw) h = '#v=chart&k=' + encodeURIComponent(topicKw);
    else if (selected && selected.type === 'issue') h = '#v=chart&i=' + encodeURIComponent(selected.id);
    else h = '#v=chart';
  }
  if (history.replaceState) history.replaceState(null, '', h || location.pathname + location.search);
}
function applyHash() {
  var m = location.hash.match(/k=([^&]+)/);
  if (m) { selectKeyword(decodeURIComponent(m[1])); return; }
  m = location.hash.match(/i=([^&]+)/);
  if (m && issueById[decodeURIComponent(m[1])]) { selectIssue(decodeURIComponent(m[1])); return; }
  if (/v=chart/.test(location.hash)) setView('chart');
}

/* ---------- カメラ ---------- */
function resetCamera() {
  var h = canvas.clientHeight || 400;
  cam.scale = Math.min(1.15, Math.max(0.65, (h - AXIS_H) / 560));
  // 最新号を右端に置く（縮刷版は右が今日）
  var w = canvas.clientWidth || 800;
  cam.x = w - (issues.length - 1) * COL_W * cam.scale - 70 * cam.scale;
  if (cam.x > 40) cam.x = 40;
  cam.y = 8;
}
function clampCamera() {
  var w = canvas.clientWidth, h = canvas.clientHeight;
  var totalW = issues.length * COL_W * cam.scale;
  var minX = Math.min(40, w - totalW - 60 * cam.scale);
  var maxX = Math.max(40, w - totalW * 0.05);
  cam.x = Math.min(maxX, Math.max(minX, cam.x));
  cam.y = Math.min(120, Math.max(-500 * cam.scale, cam.y));
}

/* ---------- 描画ループ ---------- */
function resize() {
  var w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', function () { resize(); });

var tPrev = 0;
function tick(t) {
  if (view === 'chart') {
    if (threadT < 1) threadT = Math.min(1, threadT + (t - tPrev) / 600);
    draw(t / 1000);
    maybeShootingStar(t);
  }
  tPrev = t;
  requestAnimationFrame(tick);
}

function visibleArticle(a) { return !hiddenCats[a.category]; }

function searchHit(a) {
  if (!searchQ) return false;
  var q = searchQ.toLowerCase();
  return (a.title + ' ' + (a.keywords || []).join(' ') + ' ' + (a.source || '')).toLowerCase().indexOf(q) !== -1;
}

function draw(now) {
  var w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  var s = cam.scale;
  var col0 = Math.floor((-cam.x - 60) / (COL_W * s));
  var col1 = Math.ceil((w - cam.x + 60) / (COL_W * s));
  col0 = Math.max(0, col0); col1 = Math.min(issues.length - 1, col1);

  var focusSet = focusArticles();
  var dimming = !!(focusSet || searchQ);

  ctx.save();
  ctx.translate(cam.x, cam.y);
  ctx.scale(s, s);

  // 空の塵（列ごとの決定論的な背景星。ズームしても同じ空）
  ctx.fillStyle = 'rgba(233, 223, 201, 0.10)';
  for (var c = col0; c <= col1; c++) {
    for (var d = 0; d < 6; d++) {
      var sx = c * COL_W + jitter('dust' + c + '-' + d, 'x', COL_W / 2);
      var sy = 40 + (hash32('dust' + c + '-' + d) % 520);
      ctx.fillRect(sx, sy, 1.2 / s, 1.2 / s);
    }
  }

  // 月替わりの区切り線と月ラベル
  ctx.font = (11 / s) + 'px ' + sansFont();
  ctx.textAlign = 'left';
  for (c = Math.max(1, col0); c <= col1; c++) {
    if (issues[c].date.slice(0, 7) !== issues[c - 1].date.slice(0, 7)) {
      var mx = c * COL_W - COL_W / 2;
      ctx.strokeStyle = 'rgba(233, 223, 201, 0.08)';
      ctx.lineWidth = 1 / s;
      ctx.beginPath(); ctx.moveTo(mx, -cam.y / s); ctx.lineTo(mx, (h - cam.y) / s); ctx.stroke();
      ctx.fillStyle = 'rgba(233, 223, 201, 0.4)';
      ctx.fillText(issues[c].date.slice(0, 7).replace('-', '年') + '月', mx + 8 / s, (24 - cam.y) / s);
    }
  }

  // 号どうしの結線（号を選んだとき。記事の重なりが根拠）
  if (selected && selected.type === 'issue' && sharedPairs[selected.id]) {
    sharedPairs[selected.id].forEach(function (p) {
      drawArc(colOfIssue[selected.id], colOfIssue[p.issueId], p.count, s);
    });
  }

  // 星座線（キーワードの時間軸）
  if (topicKw && kwIndex[topicKw]) {
    drawThread(kwIndex[topicKw], s, now);
  }

  // 記事の星
  var labelAll = s > 2.1;
  for (c = col0; c <= col1; c++) drawColumnArticles(c, s, now, focusSet, dimming, labelAll);

  // 号の星（4条のきらめき）とテーマ題
  var themeLabels = s > 0.45;
  for (c = col0; c <= col1; c++) {
    var iss = issues[c];
    var x = c * COL_W;
    var isSel = selected && selected.type === 'issue' && selected.id === iss.id;
    var dimIss = dimming && !isSel && !(focusSet && focusSet.issues && focusSet.issues[iss.id]);
    ctx.globalAlpha = dimIss ? 0.25 : 1;
    drawIssueStar(x, SPINE_Y, isSel ? 15 : 11, now + c, isSel);
    if (themeLabels) {
      ctx.font = (isSel ? 12.5 : 11) / s + 'px ' + sansFont();
      ctx.textAlign = 'center';
      ctx.fillStyle = isSel ? 'rgba(233,223,201,0.95)' : 'rgba(233,223,201,0.55)';
      var th = iss.theme ? truncate(iss.theme, 12) : '#' + iss.issueNo;
      ctx.fillText(th, x, SPINE_Y - 24);
      ctx.fillStyle = 'rgba(139,127,102,0.8)';
      ctx.font = (9.5 / s) + 'px ' + sansFont();
      ctx.fillText('#' + iss.issueNo + ' ' + (EDITION_LABEL[iss.edition] || ''), x, SPINE_Y - 24 + 13 / s);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  drawTimeAxis(w, h, s, col0, col1);
  drawShootingStar(now);
}

function drawColumnArticles(c, s, now, focusSet, dimming, labelAll) {
  (colArticles[c] || []).forEach(function (a) {
    if (!visibleArticle(a)) return;
    var hit = searchQ && searchHit(a);
    var focused = focusSet ? !!focusSet.arts[a.id] : false;
    var dim = dimming && !focused && !hit;
    var tw = REDUCED ? 1 : 0.78 + 0.22 * Math.sin(now * 1.7 + a.phase);
    ctx.globalAlpha = (dim ? 0.14 : 1) * tw;

    // ほのかな光背
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 2.1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(233,223,201,0.05)'; ctx.fill();
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    ctx.fillStyle = catColor(a.category); ctx.fill();

    if (a.gem) { // Hidden Gemは金の輪でひときわ光る
      var pulse = REDUCED ? 0 : Math.sin(now * 2 + a.phase) * 0.8;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 2.6 + pulse, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(233, 223, 201, 0.8)'; ctx.lineWidth = 1 / s; ctx.stroke();
    }
    var isSel = selected && selected.type === 'article' && selected.id === a.id;
    if (isSel) {
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = COLOR_THREAD; ctx.lineWidth = 1.6 / s; ctx.stroke();
    }
    ctx.globalAlpha = dim ? 0.14 : 1;
    if (labelAll || isSel || hovered === a || hit || focused) {
      var size = 10 / s;
      if (size >= 3) {
        ctx.font = size + 'px ' + sansFont();
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(233,223,201,0.7)';
        ctx.fillText(truncate(a.title, 20), a.x, a.y + a.r + size + 3 / s);
      }
    }
    ctx.globalAlpha = 1;
  });
}

function drawIssueStar(x, y, r, tt, hot) {
  var g = REDUCED ? 0 : 0.6 + 0.4 * Math.sin(tt * 0.9);
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = hot ? COLOR_THREAD : COLOR_ISSUE;
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var ang = (Math.PI / 4) * i;
    var rr = (i % 2 === 0) ? r : r * 0.36;
    ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
  }
  ctx.closePath();
  ctx.globalAlpha = 0.85 + 0.15 * g;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawArc(colA, colB, count, s) {
  var xa = colA * COL_W, xb = colB * COL_W;
  var mid = (xa + xb) / 2;
  var lift = Math.min(70, Math.abs(xb - xa) * 0.18) + 24;
  ctx.strokeStyle = 'rgba(217, 111, 54, ' + Math.min(0.75, 0.3 + count * 0.15) + ')';
  ctx.lineWidth = Math.min(3, 0.8 + count * 0.6) / s;
  ctx.beginPath();
  ctx.moveTo(xa, SPINE_Y - 12);
  ctx.quadraticCurveTo(mid, SPINE_Y - 12 - lift, xb, SPINE_Y - 12);
  ctx.stroke();
}

function drawThread(artIds, s, now) {
  var pts = artIds.map(function (id) { return articleById[id]; }).filter(visibleArticle);
  if (pts.length < 2) return;
  var n = Math.max(2, Math.ceil(pts.length * threadT));
  ctx.strokeStyle = 'rgba(217, 111, 54, 0.7)';
  ctx.lineWidth = 1.4 / s;
  ctx.setLineDash([6 / s, 4 / s]);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
  // 星座名を先頭の星に添える
  ctx.font = (12 / s) + 'px ' + sansFont();
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(217, 111, 54, 0.9)';
  ctx.fillText(topicKw, pts[0].x + 10 / s, pts[0].y - 10 / s);
}

/* 選択に応じて「光らせる記事」の集合を作る */
function focusArticles() {
  if (topicKw && kwIndex[topicKw]) {
    var set = { arts: {}, issues: {} };
    kwIndex[topicKw].forEach(function (id) {
      set.arts[id] = true;
      articleById[id].issues.forEach(function (iid) { set.issues[iid] = true; });
    });
    return set;
  }
  if (selected && selected.type === 'issue') {
    var s2 = { arts: {}, issues: {} };
    s2.issues[selected.id] = true;
    articlesOfIssue(selected.id).forEach(function (a) { s2.arts[a.id] = true; });
    (sharedPairs[selected.id] || []).forEach(function (p) { s2.issues[p.issueId] = true; });
    return s2;
  }
  if (selected && selected.type === 'article') {
    var s3 = { arts: {}, issues: {} };
    s3.arts[selected.id] = true;
    (articleById[selected.id].issues || []).forEach(function (iid) { s3.issues[iid] = true; });
    return s3;
  }
  return null;
}

/* ---------- 時間軸（下端。ラベル密度はズームに追従） ---------- */
function drawTimeAxis(w, h, s, col0, col1) {
  ctx.fillStyle = 'rgba(20, 17, 12, 0.92)';
  ctx.fillRect(0, h - AXIS_H, w, AXIS_H);
  ctx.strokeStyle = 'rgba(233, 223, 201, 0.14)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h - AXIS_H + 0.5); ctx.lineTo(w, h - AXIS_H + 0.5); ctx.stroke();

  var pxPerCol = COL_W * s;
  var step = Math.max(1, Math.ceil(56 / pxPerCol));
  ctx.font = '10px ' + sansFont();
  ctx.textAlign = 'center';
  for (var c = col0; c <= col1; c++) {
    var x = cam.x + c * COL_W * s;
    if (x < -30 || x > w + 30) continue;
    ctx.fillStyle = 'rgba(233, 223, 201, 0.25)';
    ctx.fillRect(x - 0.5, h - AXIS_H, 1, 4);
    if (c % step !== 0) continue;
    var iss = issues[c];
    ctx.fillStyle = 'rgba(233, 223, 201, 0.55)';
    ctx.fillText(iss.date.slice(5).replace('-', '/'), x, h - AXIS_H + 16);
    ctx.fillStyle = 'rgba(139, 127, 102, 0.9)';
    ctx.fillText(iss.edition === 'morning' ? '朝' : iss.edition === 'midday' ? '昼' : '夕', x, h - AXIS_H + 28);
  }
}

/* ---------- 流れ星（ごくたまに。遊び心） ---------- */
function maybeShootingStar(t) {
  if (REDUCED) return;
  if (!shootingStar && Math.random() < 0.0007) {
    var w = canvas.clientWidth;
    shootingStar = { x0: Math.random() * w * 0.7 + w * 0.15, y0: 30 + Math.random() * 90, t0: t, dur: 700 };
  }
}
function drawShootingStar(now) {
  if (!shootingStar) return;
  var t = performance.now();
  var p = (t - shootingStar.t0) / shootingStar.dur;
  if (p >= 1) { shootingStar = null; return; }
  var x = shootingStar.x0 + p * 130, y = shootingStar.y0 + p * 46;
  var grad = ctx.createLinearGradient(x - 40, y - 14, x, y);
  grad.addColorStop(0, 'rgba(233, 223, 201, 0)');
  grad.addColorStop(1, 'rgba(233, 223, 201, ' + (0.7 * (1 - p)) + ')');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x - 40, y - 14); ctx.lineTo(x, y); ctx.stroke();
}

/* ---------- ヒットテストと操作 ---------- */
function toWorld(px, py) { return { x: (px - cam.x) / cam.scale, y: (py - cam.y) / cam.scale }; }

function pick(px, py) {
  var p = toWorld(px, py);
  var best = null, bestD = Infinity;
  var colGuess = Math.round(p.x / COL_W);
  issues.forEach(function (iss) {
    var c = colOfIssue[iss.id];
    if (Math.abs(c - colGuess) > 2) return;
    var dx = c * COL_W - p.x, dy = SPINE_Y - p.y;
    var dd = Math.sqrt(dx * dx + dy * dy);
    if (dd < Math.max(16, 14 / cam.scale) && dd < bestD) { best = { type: 'issue', node: iss }; bestD = dd; }
  });
  for (var c = colGuess - 2; c <= colGuess + 2; c++) {
    (colArticles[c] || []).forEach(function (a) {
      if (!visibleArticle(a)) return;
      var dx = a.x - p.x, dy = a.y - p.y;
      var dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < Math.max(a.r + 5, 11 / cam.scale) && dd < bestD) { best = { type: 'article', node: a }; bestD = dd; }
    });
  }
  return best;
}

var panning = false, lastX = 0, lastY = 0, moved = 0, pinchDist = 0;

canvas.addEventListener('pointerdown', function (ev) {
  canvas.setPointerCapture(ev.pointerId);
  panning = true; moved = 0;
  canvas.classList.add('dragging');
  lastX = ev.offsetX; lastY = ev.offsetY;
});
canvas.addEventListener('pointermove', function (ev) {
  if (panning) {
    cam.x += ev.offsetX - lastX; cam.y += ev.offsetY - lastY;
    clampCamera();
    moved += Math.abs(ev.offsetX - lastX) + Math.abs(ev.offsetY - lastY);
  } else {
    var hit = pick(ev.offsetX, ev.offsetY);
    hovered = hit && hit.type === 'article' ? hit.node : null;
    canvas.style.cursor = hit ? 'pointer' : 'grab';
  }
  lastX = ev.offsetX; lastY = ev.offsetY;
});
canvas.addEventListener('pointerup', function (ev) {
  canvas.classList.remove('dragging');
  panning = false;
  if (moved < 6) {
    var hit = pick(ev.offsetX, ev.offsetY);
    if (!hit) { clearSelection(); }
    else if (hit.type === 'issue') selectIssue(hit.node.id);
    else selectArticle(hit.node.id);
  }
});
canvas.addEventListener('pointerleave', function () { hovered = null; });

canvas.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  var factor = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoomAt(ev.offsetX, ev.offsetY, factor);
}, { passive: false });

canvas.addEventListener('touchmove', function (ev) {
  if (ev.touches.length === 2) {
    ev.preventDefault();
    var t0 = ev.touches[0], t1 = ev.touches[1];
    var d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    if (pinchDist > 0) {
      var rect = canvas.getBoundingClientRect();
      zoomAt((t0.clientX + t1.clientX) / 2 - rect.left, (t0.clientY + t1.clientY) / 2 - rect.top, d / pinchDist);
    }
    pinchDist = d;
  }
}, { passive: false });
canvas.addEventListener('touchend', function () { pinchDist = 0; });

function zoomAt(px, py, factor) {
  var ns = Math.min(4, Math.max(0.25, cam.scale * factor));
  var real = ns / cam.scale;
  cam.x = px - (px - cam.x) * real;
  cam.y = py - (py - cam.y) * real;
  cam.scale = ns;
  clampCamera();
}

/* ---------- 選択 ---------- */
var panel = document.getElementById('panel');
var panelBody = document.getElementById('panel-body');
document.getElementById('panel-close').addEventListener('click', function () { clearSelection(); });

function clearSelection() {
  selected = null; topicKw = null;
  panel.classList.add('hidden');
  syncHash();
}

function selectIssue(id) {
  var iss = issueById[id];
  if (!iss) return;
  selected = { type: 'issue', id: id };
  topicKw = null;
  setView('chart');
  centerCol(colOfIssue[id]);
  renderIssuePanel(iss);
  syncHash();
}

function selectArticle(id) {
  selected = { type: 'article', id: id };
  topicKw = null;
  renderArticlePanel(articleById[id]);
  syncHash();
}

function selectKeyword(k) {
  if (!kwIndex[k]) return;
  topicKw = k; threadT = 0;
  selected = { type: 'keyword', id: k };
  setView('chart');
  centerCol(articleById[kwIndex[k][0]].col);
  renderKeywordPanel(k);
  syncHash();
}

function centerCol(c) {
  var w = canvas.clientWidth || 800;
  cam.x = w / 2 - c * COL_W * cam.scale;
  clampCamera();
}

/* ---------- パネル ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
  });
}
function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function sansFont() { return '"Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif'; }

function renderArticlePanel(a) {
  var html = '<div class="panel-kicker">' + esc(CAT_LABEL[a.category] || a.category) +
    (a.gem ? ' / HIDDEN GEM' : '') + '</div>';
  html += '<h2><a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a></h2>';
  html += '<div class="panel-meta">' + esc(a.date) + ' 掲載 / ' + esc(a.source || '') +
    (a.temperature != null ? ' / Heat ' + esc(a.temperature) + '&#8451;' : '') + '</div>';
  if (a.summaryJa && a.summaryJa.length) {
    html += '<div class="summary">';
    a.summaryJa.forEach(function (line) { html += '<p>' + esc(line) + '</p>'; });
    html += '</div>';
  }
  if (a.keywords && a.keywords.length) {
    html += '<div class="panel-kicker" style="margin-top:14px">キーワード（選ぶと星座線）</div><div class="kw-chips">';
    a.keywords.forEach(function (k) {
      html += kwIndex[k]
        ? '<button data-kw="' + esc(k) + '">' + esc(k) + ' ' + kwIndex[k].length + '</button>'
        : '<button disabled style="opacity:.5">' + esc(k) + '</button>';
    });
    html += '</div>';
  }
  html += '<div class="panel-kicker" style="margin-top:16px">掲載号</div><ul class="linked">';
  a.issues.forEach(function (iid) {
    var iss = issueById[iid];
    if (!iss) return;
    html += '<li><a data-issue="' + esc(iid) + '">#' + esc(iss.issueNo) + ' ' +
      esc(EDITION_LABEL[iss.edition] || '') + (iss.theme ? ' 『' + esc(iss.theme) + '』' : '') + '</a>' +
      '<span class="sub">' + esc(iss.date) + '</span></li>';
  });
  html += '</ul>';
  openPanel(html);
}

function renderIssuePanel(iss) {
  var arts = articlesOfIssue(iss.id).sort(function (a, b) { return (b.temperature || 0) - (a.temperature || 0); });
  var html = '<div class="panel-kicker">#' + esc(iss.issueNo) + ' ' + esc(EDITION_LABEL[iss.edition] || '') +
    ' / ' + esc(iss.date) + '</div>';
  html += '<h2>' + (iss.theme ? '『' + esc(iss.theme) + '』' : '（無題）') + '</h2>';
  if (iss.themeNote) html += '<div class="theme-note">' + esc(iss.themeNote) + '</div>';
  var shared = sharedPairs[iss.id] || [];
  if (shared.length) {
    html += '<div class="panel-kicker" style="margin-top:14px">つながる号（同じ記事を載せた号）</div><ul class="linked">';
    shared.slice(0, 6).forEach(function (p) {
      var o = issueById[p.issueId];
      html += '<li><a data-issue="' + esc(p.issueId) + '">#' + esc(o.issueNo) + ' ' +
        esc(EDITION_LABEL[o.edition] || '') + (o.theme ? ' 『' + esc(o.theme) + '』' : '') + '</a>' +
        '<span class="sub">' + esc(o.date) + ' / 共有記事 ' + p.count + '本</span></li>';
    });
    html += '</ul>';
  }
  html += '<div class="panel-kicker" style="margin-top:16px">この号の紙面（' + arts.length + '本）</div><ul class="linked">';
  arts.forEach(function (a) {
    html += '<li><span class="cat-mark" style="background:' + catColor(a.category) + '"></span>' +
      '<a data-article="' + esc(a.id) + '">' + esc(a.title) + '</a>' +
      '<span class="sub">' + esc(CAT_LABEL[a.category] || a.category) + (a.gem ? ' / HIDDEN GEM' : '') + '</span></li>';
  });
  html += '</ul>';
  openPanel(html);
}

function renderKeywordPanel(k) {
  var ids = kwIndex[k] || [];
  var issSet = {};
  ids.forEach(function (id) { articleById[id].issues.forEach(function (iid) { issSet[iid] = true; }); });
  var html = '<div class="panel-kicker">キーワード / 星座線</div><h2>' + esc(k) + '</h2>';
  html += '<div class="panel-meta">' + ids.length + '記事 / ' + Object.keys(issSet).length + '号にまたがる話題の時間軸</div>';
  html += '<ul class="linked">';
  ids.forEach(function (id) {
    var a = articleById[id];
    html += '<li><span class="cat-mark" style="background:' + catColor(a.category) + '"></span>' +
      '<a data-article="' + esc(a.id) + '">' + esc(a.title) + '</a>' +
      '<span class="sub">' + esc(a.date) + ' / ' + esc(CAT_LABEL[a.category] || a.category) + '</span></li>';
  });
  html += '</ul>';
  openPanel(html);
}

function openPanel(html) {
  panelBody.innerHTML = html;
  panel.classList.remove('hidden');
  panelBody.querySelectorAll('a[data-article]').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.preventDefault();
      var a = articleById[el.getAttribute('data-article')];
      if (a) { selectArticle(a.id); centerCol(a.col); }
    });
  });
  panelBody.querySelectorAll('a[data-issue]').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.preventDefault();
      selectIssue(el.getAttribute('data-issue'));
    });
  });
  panelBody.querySelectorAll('button[data-kw]').forEach(function (el) {
    el.addEventListener('click', function () { selectKeyword(el.getAttribute('data-kw')); });
  });
}

/* ---------- 検索とリセット ---------- */
var searchBox = document.getElementById('search');
searchBox.addEventListener('input', function () {
  searchQ = searchBox.value.trim();
  if (view === 'toc') buildToc();
});
searchBox.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' || !searchQ) return;
  var first = articles.filter(visibleArticle).find(searchHit);
  if (first) { setView('chart'); selectArticle(first.id); centerCol(first.col); }
});

document.getElementById('btn-reset').addEventListener('click', function () {
  searchBox.value = ''; searchQ = '';
  clearSelection();
  resetCamera();
  if (view === 'toc') buildToc();
});

})();
</script>

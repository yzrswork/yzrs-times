name: Publish Morning Edition

on:
  schedule:
    - cron: '17 20 * * *'  # 5:17 JST
    - cron: '47 22 * * *'  # 7:47 JST (補習)
  workflow_dispatch:
    inputs:
      force:
        description: '既に発行済みでも再発行する（同日同版は上書き・号数は再利用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish-edition
        with:
          edition: morning
          force: ${{ inputs.force }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

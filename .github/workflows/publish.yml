name: Publish Morning Edition

on:
  schedule:
    - cron: '17 20 * * *'  # 5:17 JST
    - cron: '47 22 * * *'  # 7:47 JST (補習)
  workflow_dispatch:
    inputs:
      force:
        description: '既に発行済みでも再発行する（同日同版は上書き・号数は再利用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: publish
        uses: ./.github/actions/publish-edition
        with:
          edition: morning
          force: ${{ inputs.force }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Times delivery artifact
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: times-delivery
          path: ${{ runner.temp }}/times-delivery
          if-no-files-found: error

      - name: Dispatch Site receiver
        if: steps.publish.outputs.published == 'true' && vars.SITE_SYNC_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
          EDITION: morning
          PUBLISHED_AT: ${{ steps.publish.outputs.published_at }}
        run: node scripts/dispatch-site.mjs

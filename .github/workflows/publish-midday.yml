name: Publish Midday Edition

on:
  schedule:
    - cron: '47 2 * * *'  # 11:47 JST
    - cron: '17 4 * * *'  # 13:17 JST (補習)
  workflow_dispatch:
    inputs:
      force:
        description: '既に発行済みでも再発行する（同日同版は上書き・号数は再利用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/publish-edition
        with:
          edition: midday
          force: ${{ inputs.force }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

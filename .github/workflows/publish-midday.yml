name: Publish Midday Edition

on:
  schedule:
    - cron: '47 2 * * *'  # 11:47 JST
    - cron: '17 4 * * *'  # 13:17 JST (補習)
  workflow_dispatch:
    inputs:
      force:
        description: '既に発行済みでも再発行する（同日同版は上書き・号数は再利用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: publish
        uses: ./.github/actions/publish-edition
        with:
          edition: midday
          force: ${{ inputs.force }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Times delivery
        id: package_delivery
        if: steps.publish.outputs.published == 'true'
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
          EDITION: midday
        run: |
          node scripts/package-times-delivery.mjs \
            --source-root public/data \
            --destination "$RUNNER_TEMP/times-delivery" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --edition "$EDITION" \
            --output "$GITHUB_OUTPUT"

      - name: Upload Times delivery artifact
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: times-delivery
          path: ${{ runner.temp }}/times-delivery
          if-no-files-found: error

      - name: Dispatch Site receiver
        if: steps.publish.outputs.published == 'true' && vars.SITE_SYNC_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
          EDITION: midday
          PUBLISHED_AT: ${{ steps.package_delivery.outputs.published_at }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SITE_SYNC_ENABLED=true but SITE_SYNC_TOKEN is not configured"
            exit 1
          fi
          gh workflow run sync-times.yml \
            --repo yzrswork/yzrswork-site \
            --ref main \
            --field source_run_id="$SOURCE_RUN_ID" \
            --field source_sha="$SOURCE_SHA" \
            --field edition="$EDITION" \
            --field published_at="$PUBLISHED_AT"

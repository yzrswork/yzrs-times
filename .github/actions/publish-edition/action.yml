name: Publish Edition
description: Build and publish a YZRS Times edition
outputs:
  published:
    description: Whether this run generated and pushed a new Times edition
    value: ${{ steps.commit.outputs.published }}
  source_sha:
    description: The actual post-publication repository HEAD SHA
    value: ${{ steps.commit.outputs.source_sha }}
  published_at:
    description: Canonical generatedAt of the published edition
    value: ${{ steps.package.outputs.published_at }}
inputs:
  edition:
    description: 'Edition to publish (morning / midday)'
    required: true
  force:
    description: 'Re-publish even if already published'
    required: false
    default: 'false'
  gemini-api-key:
    description: 'Gemini API key'
    required: true
  github-token:
    description: 'GitHub token for source fetching'
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build issue
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        ARGS=""
        if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
        node scripts/build-issue.mjs ${{ inputs.edition }} $ARGS

    - name: Build graph
      shell: bash
      run: node scripts/build-graph.mjs

    - name: Create local publication commit
      id: commit
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "YZRS Times 編集部"
        git config user.email "actions@users.noreply.github.com"
        git add public/data data
        if git diff --cached --quiet; then
          echo "変更なし。"
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        MSG=$(cat data/last-issue-message.txt 2>/dev/null || echo "Publish issue")
        git commit -m "$MSG"
        if [ -n "$(git status --porcelain -- public/data data)" ]; then
          echo "::error::publication tree changed while creating the local commit"
          exit 1
        fi
        echo "published=true" >> "$GITHUB_OUTPUT"
        echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Validate exact committed delivery
      id: package
      if: success() && steps.commit.outputs.published == 'true'
      shell: bash
      env:
        SOURCE_RUN_ID: ${{ github.run_id }}
        SOURCE_SHA: ${{ steps.commit.outputs.source_sha }}
        EDITION: ${{ inputs.edition }}
      run: |
        set -euo pipefail
        if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ] || [ -n "$(git status --porcelain -- public/data data)" ]; then
          echo "::error::publication tree does not match the local commit selected for promotion"
          exit 1
        fi
        node scripts/package-times-delivery.mjs \
          --source-root public/data \
          --destination "$RUNNER_TEMP/times-delivery" \
          --source-run-id "$SOURCE_RUN_ID" \
          --source-sha "$SOURCE_SHA" \
          --edition "$EDITION" \
          --output "$GITHUB_OUTPUT"
        if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ] || [ -n "$(git status --porcelain -- public/data data)" ]; then
          echo "::error::publication tree changed during delivery validation"
          exit 1
        fi

    - name: Push validated publication
      if: success() && steps.commit.outputs.published == 'true'
      shell: bash
      env:
        SOURCE_SHA: ${{ steps.commit.outputs.source_sha }}
      run: |
        set -euo pipefail
        if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ] || [ -n "$(git status --porcelain -- public/data data)" ]; then
          echo "::error::refusing to push a tree other than the validated publication"
          exit 1
        fi
        case "$GITHUB_REF" in
          refs/heads/*) git push origin "HEAD:$GITHUB_REF" ;;
          *) echo "::error::publication push requires a branch ref"; exit 1 ;;
        esac
